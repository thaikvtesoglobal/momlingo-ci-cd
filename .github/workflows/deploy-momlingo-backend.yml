# ============================================================
# Momlingo Backend (API) — GitHub Actions CI/CD
#
# File này thuộc GitHub public repo (momlingo-ci-cd).
# KHÔNG commit source code momlingo-backend vào repo này.
#
# Trigger duy nhất: repository_dispatch từ momlingo-backend
# (workflow "Trigger Deploy" chạy khi push vào nhánh dev/main).
# ============================================================

name: Deploy Momlingo Backend

on:
  repository_dispatch:
    types: [deploy-momlingo-backend]

# ── Payload từ momlingo-backend Actions ─────────────────────
# github.event.client_payload.env   (dev | prod)
# github.event.client_payload.sha   (commit vừa merge)

# Mỗi env chỉ chạy 1 lần tại 1 thời điểm (backup/migrate không được chồng nhau).
concurrency:
  group: deploy-momlingo-backend-${{ github.event.client_payload.env }}
  cancel-in-progress: false

jobs:
  # ── Backup DB trên VPS TRƯỚC khi deploy ──────────────────────
  # Backend chạy migration tự động khi khởi động (migrationsRun: true), nên
  # phải có bản dump ngay trước đó để rollback nếu migration hỏng dữ liệu.
  # File dump nằm trên HOST của VPS (~/momlingo/backups/mysql/<env>), KHÔNG
  # nằm trong container. Backup lỗi => job fail => không build, không deploy.
  #
  # Restore (chạy trên VPS):
  #   gunzip -c ~/momlingo/backups/mysql/<env>/<file>.sql.gz | \
  #     docker compose --env-file .env.<env> exec -T <db|db_momlingo> \
  #     sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot "$MYSQL_DATABASE"'
  backup-db:
    name: "Backup DB (${{ github.event.client_payload.env }})"
    runs-on: ubuntu-latest
    steps:
      - name: Backup DB on VPS dev
        if: github.event.client_payload.env == 'dev'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.MOMLINGO_BACKEND_VPS_HOST_DEV }}
          username: ${{ secrets.MOMLINGO_BACKEND_VPS_USER_DEV }}
          password: ${{ secrets.MOMLINGO_BACKEND_VPS_PASSWORD_DEV }}
          script_stop: true
          script: |
            set -eu
            ENV_NAME=dev
            ENV_FILE=.env.dev
            DB_SERVICE=db
            SHA_SHORT=$(echo "${{ github.event.client_payload.sha }}" | cut -c1-8)
            KEEP=14

            cd momlingo/momlingo_be
            umask 077
            BACKUP_DIR="$HOME/momlingo/backups/mysql/$ENV_NAME"
            mkdir -p "$BACKUP_DIR"
            OUT="$BACKUP_DIR/${ENV_NAME}_$(date +%Y%m%d_%H%M%S)_pre-${SHA_SHORT}.sql"

            docker compose --env-file "$ENV_FILE" ps --status running --services | grep -qx "$DB_SERVICE" \
              || { echo "DB service '$DB_SERVICE' không chạy, dừng deploy"; exit 1; }

            # Mật khẩu lấy từ env trong container (không lộ trên command line).
            # --single-transaction: dump nhất quán InnoDB, không khoá bảng khi app đang chạy.
            docker compose --env-file "$ENV_FILE" exec -T "$DB_SERVICE" sh -c \
              'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqldump -uroot --single-transaction --quick --routines --triggers --events --no-tablespaces --default-character-set=utf8mb4 "$MYSQL_DATABASE"' \
              > "$OUT.tmp"

            # mysqldump chạy xong luôn có dòng cuối "-- Dump completed"; thiếu = dump dở.
            tail -n 1 "$OUT.tmp" | grep -q "Dump completed" \
              || { echo "Dump không hoàn tất, huỷ backup"; rm -f "$OUT.tmp"; exit 1; }

            mv "$OUT.tmp" "$OUT"
            gzip -f "$OUT"
            gzip -t "$OUT.gz"
            echo "Backup OK: $OUT.gz ($(du -h "$OUT.gz" | cut -f1))"

            # Giữ $KEEP bản mới nhất
            ls -1t "$BACKUP_DIR"/*.sql.gz | tail -n +$((KEEP + 1)) | xargs -r rm --

      - name: Backup DB on VPS prod
        if: github.event.client_payload.env == 'prod'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.MOMLINGO_VPS_HOST_PROD }}
          username: ${{ secrets.MOMLINGO_VPS_USER_PROD }}
          key: ${{ secrets.MOMLINGO_VPS_SSH_KEY_PROD }}
          script_stop: true
          script: |
            set -eu
            ENV_NAME=prod
            ENV_FILE=.env.prod
            DB_SERVICE=db_momlingo
            SHA_SHORT=$(echo "${{ github.event.client_payload.sha }}" | cut -c1-8)
            KEEP=30

            cd momlingo/momlingo_be
            umask 077
            BACKUP_DIR="$HOME/momlingo/backups/mysql/$ENV_NAME"
            mkdir -p "$BACKUP_DIR"
            OUT="$BACKUP_DIR/${ENV_NAME}_$(date +%Y%m%d_%H%M%S)_pre-${SHA_SHORT}.sql"

            docker compose --env-file "$ENV_FILE" ps --status running --services | grep -qx "$DB_SERVICE" \
              || { echo "DB service '$DB_SERVICE' không chạy, dừng deploy"; exit 1; }

            docker compose --env-file "$ENV_FILE" exec -T "$DB_SERVICE" sh -c \
              'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqldump -uroot --single-transaction --quick --routines --triggers --events --no-tablespaces --default-character-set=utf8mb4 "$MYSQL_DATABASE"' \
              > "$OUT.tmp"

            tail -n 1 "$OUT.tmp" | grep -q "Dump completed" \
              || { echo "Dump không hoàn tất, huỷ backup"; rm -f "$OUT.tmp"; exit 1; }

            mv "$OUT.tmp" "$OUT"
            gzip -f "$OUT"
            gzip -t "$OUT.gz"
            echo "Backup OK: $OUT.gz ($(du -h "$OUT.gz" | cut -f1))"

            ls -1t "$BACKUP_DIR"/*.sql.gz | tail -n +$((KEEP + 1)) | xargs -r rm --

  build-and-deploy:
    name: "Build & Deploy (${{ github.event.client_payload.env }})"
    needs: backup-db
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image/dockerfile theo env
        id: vars
        run: |
          ENV="${{ github.event.client_payload.env }}"
          if [ "$ENV" = "prod" ]; then
            echo "image_name=momlingo-backend" >> $GITHUB_OUTPUT
            echo "dockerfile=Dockerfile.prod" >> $GITHUB_OUTPUT
            echo "env_file=.env.prod" >> $GITHUB_OUTPUT
          else
            echo "image_name=momlingo-backend-dev" >> $GITHUB_OUTPUT
            echo "dockerfile=Dockerfile" >> $GITHUB_OUTPUT
            echo "env_file=.env.dev" >> $GITHUB_OUTPUT
          fi

      - name: Clone momlingo-backend source
        run: |
          git clone \
            "https://x-access-token:${{ secrets.MOMLINGO_SOURCE_TOKEN }}@github.com/TESOSOFTWARE/momlingo-backend.git" \
            source
          cd source && git checkout "${{ github.event.client_payload.sha }}"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: tesosoftware
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/${{ steps.vars.outputs.dockerfile }}
          push: true
          tags: ghcr.io/tesosoftware/${{ steps.vars.outputs.image_name }}:latest

      - name: Deploy on VPS dev
        if: github.event.client_payload.env == 'dev'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.MOMLINGO_BACKEND_VPS_HOST_DEV }}
          username: ${{ secrets.MOMLINGO_BACKEND_VPS_USER_DEV }}
          password: ${{ secrets.MOMLINGO_BACKEND_VPS_PASSWORD_DEV }}
          script: |
            set -e
            cd momlingo/momlingo_be
            docker compose --env-file ${{ steps.vars.outputs.env_file }} pull app
            docker compose --env-file ${{ steps.vars.outputs.env_file }} up -d app
            # dist/ only (no ts-node/tsconfig in the image) — run the compiled-JS variant.
            docker compose --env-file ${{ steps.vars.outputs.env_file }} exec -T app yarn migration:run:prod

      - name: Deploy on VPS prod
        if: github.event.client_payload.env == 'prod'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.MOMLINGO_VPS_HOST_PROD }}
          username: ${{ secrets.MOMLINGO_VPS_USER_PROD }}
          key: ${{ secrets.MOMLINGO_VPS_SSH_KEY_PROD }}
          script: |
            set -e
            cd momlingo/momlingo_be
            docker compose --env-file ${{ steps.vars.outputs.env_file }} pull momlingo-app
            docker compose --env-file ${{ steps.vars.outputs.env_file }} up -d momlingo-app
            # dist/ only (no ts-node/tsconfig in the image) — run the compiled-JS variant.
            docker compose --env-file ${{ steps.vars.outputs.env_file }} exec -T momlingo-app yarn migration:run:prod
