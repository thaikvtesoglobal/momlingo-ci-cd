# ============================================================
# Momlingo TTS Service (API) — GitHub Actions CI/CD
#
# File này thuộc GitHub public repo (momlingo-ci-cd).
# KHÔNG commit source code momlingo-tts-service vào repo này.
#
# Trigger duy nhất: repository_dispatch từ momlingo-tts-service
# (workflow "Trigger Deploy" chạy khi push vào nhánh dev).
#
# Chỉ có môi trường dev — không deploy prod riêng cho service này.
# Server dev đủ mạnh để phục vụ, các service khác (backend/admin)
# gọi thẳng qua tts.dev.momlingo.com kể cả khi bản thân chúng chạy
# ở môi trường prod.
#
# LƯU Ý: repo nguồn đã đổi tên momlingo-f5-tts-service → momlingo-tts-service
# và đổi engine F5-TTS → VieNeu-TTS-v3-Turbo (không còn checkpoint VI thủ
# công, model tự tải từ Hugging Face). Secret VPS đã đổi tên khớp theo
# (MOMLINGO_TTS_VPS_* thay cho MOMLINGO_F5TTS_VPS_* cũ).
# ============================================================

name: Deploy Momlingo TTS Service

on:
  repository_dispatch:
    types: [deploy-momlingo-tts-service]

# ── Payload từ momlingo-tts-service Actions ──────────────
# github.event.client_payload.env   (dev)
# github.event.client_payload.sha   (commit vừa merge)

jobs:
  build-and-deploy:
    name: "Build & Deploy (dev)"
    runs-on: ubuntu-latest
    steps:
      - name: Clone momlingo-tts-service source
        run: |
          git clone \
            "https://x-access-token:${{ secrets.MOMLINGO_SOURCE_TOKEN }}@github.com/TESOSOFTWARE/momlingo-tts-service.git" \
            source
          cd source && git checkout "${{ github.event.client_payload.sha }}"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: tesosoftware
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/Dockerfile
          push: true
          tags: ghcr.io/tesosoftware/momlingo-tts-service-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on VPS dev
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.MOMLINGO_TTS_VPS_HOST_DEV }}
          username: ${{ secrets.MOMLINGO_TTS_VPS_USER_DEV }}
          password: ${{ secrets.MOMLINGO_TTS_VPS_PASSWORD_DEV }}
          command_timeout: 60m
          script: |
            cd momlingo/momlingo_tts

            docker compose -f docker-compose.dev.yml --env-file .env.dev pull tts-service
            docker compose -f docker-compose.dev.yml --env-file .env.dev up -d tts-service
